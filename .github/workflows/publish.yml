name: Publish container
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/verify
        id: verify
      - name: Publish verified image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFIED_IMAGE: ${{ steps.verify.outputs.image }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "$VERIFIED_IMAGE" "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            docker tag "$VERIFIED_IMAGE" "$IMAGE:$GITHUB_REF_NAME"
            docker push "$IMAGE:$GITHUB_REF_NAME"
          fi
      - name: Clear registry login
        if: always()
        run: docker logout ghcr.io
