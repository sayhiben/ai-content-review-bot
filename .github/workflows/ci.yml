name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-fund
      - run: npm run check
      - run: npm run audit:production
      - name: Preview commands without credentials or network access
        run: node --require ./tests/offline.cjs dist/registerCommands.js
      - name: Build production image
        run: docker build --build-arg REVISION="$GITHUB_SHA" -t ai-review-ci .
      - name: Verify final image without network access or credentials
        run: >-
          docker run --rm --network none --read-only --tmpfs /tmp:rw,size=32m,mode=1777
          --cap-drop ALL --security-opt no-new-privileges:true --entrypoint node
          -v "$PWD/tests/container-smoke.cjs:/app/container-smoke.cjs:ro"
          ai-review-ci /app/container-smoke.cjs
